[supervisord]
nodaemon=true
logfile=/var/lib/mbiiez/supervisord.log
pidfile=/var/lib/mbiiez/supervisord.pid

[program:api]
command=/opt/openjk/venv/bin/python3 /app/mbii.py api serve --host 0.0.0.0 --port 8081
directory=/app
autostart=true
autorestart=true
stopasgroup=false
killasgroup=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:instances]
command=/opt/openjk/venv/bin/python3 /app/deploy/container-instances.py
directory=/app
autostart=true
autorestart=unexpected
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
